services:
  timescaledb:
    build: .
    image: timescale/timescaledb:2.23.0-pg16
    shm_size: 2g
    container_name: timescaledb_pg16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: ${TZ:-UTC}
    # PostgreSQL доступен только внутри docker network, внешний доступ через PgBouncer
    expose:
      - "5432"
    # volumes:
    #   - D:/timescaledb:/var/lib/postgresql/data #:TODO: change to relative path
    #   - ./initdb:/docker-entrypoint-initdb.d:ro
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - hft_network

  # ==================== PgBouncer (Connection Pooler) ====================
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    container_name: pgbouncer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-postgres}"
      AUTH_TYPE: scram-sha-256
      # Pool settings
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 50
      SERVER_IDLE_TIMEOUT: 600
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "5432:5432"   # Внешний 5432 -> PgBouncer 5432
    networks:
      - hft_network
    depends_on:
      timescaledb:
        condition: service_healthy

  # ==================== Postgres Exporter (для Prometheus) ====================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-timescale
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "timescaledb:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "9187:9187"  # Prometheus scrape port
    networks:
      - hft_network
    depends_on:
      timescaledb:
        condition: service_healthy

  # ==================== Node Exporter (Host Metrics) ====================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-timescale
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    ports:
      - "9100:9100"  # Prometheus scrape port
    networks:
      - hft_network

networks:
  hft_network:
    driver: bridge
    name: hft_network

