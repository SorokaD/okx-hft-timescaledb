services:
  # ==================== TimescaleDB (Postgres) ====================
  timescaledb:
    image: timescale/timescaledb:2.23.0-pg16
    container_name: timescaledb_pg16
    shm_size: 2g
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: ${TZ:-UTC}

    # ВАЖНО: наружу порт НЕ публикуем.
    # Только внутри docker-network.
    expose:
      - "5432"

    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped
    networks:
      - hft_network

  # ==================== PgBouncer ====================
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0   # лучше фиксировать версию, не latest
    container_name: pgbouncer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Подключение PgBouncer к Timescale по внутреннему DNS "timescaledb"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-postgres}"
      IGNORE_STARTUP_PARAMETERS: "extra_float_digits,search_path"
      AUTH_TYPE: scram-sha-256
      # pool
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 50
      SERVER_IDLE_TIMEOUT: 600

    # ВАЖНО:
    # СНАРУЖИ 6432 -> ВНУТРИ контейнера 5432 (PgBouncer слушает 5432)
    ports:
      - "127.0.0.1:6432:5432"

    depends_on:
      timescaledb:
        condition: service_healthy

    networks:
      - hft_network

  # ==================== Postgres Exporter (Prometheus) ====================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-timescale
    restart: unless-stopped
    command:
      - "--extend.query-path=/etc/postgres_exporter/queries.yml"
      - "--disable-default-metrics"
    env_file:
      - .env
    environment:
      # Лучше напрямую в Timescale (внутри сети), чтобы видеть real DB stats
      DATA_SOURCE_URI: "timescaledb:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    mem_limit: 256m
    cpus: "0.3"
    ports:
      - "9187:9187"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - hft_network

networks:
  hft_network:
    driver: bridge
    name: hft_network
