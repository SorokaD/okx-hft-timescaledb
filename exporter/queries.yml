pg_stat_activity:
  query: "SELECT state, count(*) AS count FROM pg_stat_activity GROUP BY state;"
  metrics:
    - state:
        usage: "LABEL"
        description: "Connection state"
    - count:
        usage: "GAUGE"
        description: "Number of connections"


pg_postmaster_start_time:
  query: "SELECT EXTRACT(EPOCH FROM pg_postmaster_start_time()) AS seconds;"
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "PostgreSQL start time in seconds since epoch"
