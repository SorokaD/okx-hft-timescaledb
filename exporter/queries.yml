pg_stat_activity:
  query: "SELECT state, count(*) AS count FROM pg_stat_activity GROUP BY state;"
  metrics:
    - state:
        usage: "LABEL"
        description: "Connection state"
    - count:
        usage: "GAUGE"
        description: "Number of connections"

pg_stat_database:
  query: "SELECT datname, tup_inserted, tup_updated, tup_deleted, tup_fetched, tup_returned, blks_hit, blks_read FROM pg_stat_database WHERE datname = 'okx_hft';"
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - tup_inserted:
        usage: "COUNTER"
        description: "Rows inserted"
    - tup_updated:
        usage: "COUNTER"
        description: "Rows updated"
    - tup_deleted:
        usage: "COUNTER"
        description: "Rows deleted"
    - tup_fetched:
        usage: "COUNTER"
        description: "Rows fetched"
    - tup_returned:
        usage: "COUNTER"
        description: "Rows returned"
    - blks_hit:
        usage: "COUNTER"
        description: "Buffer cache hits"
    - blks_read:
        usage: "COUNTER"
        description: "Disk blocks read"

pg_database_size:
  query: "SELECT 'okx_hft' AS datname, pg_database_size('okx_hft') AS bytes;"
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - bytes:
        usage: "GAUGE"
        description: "Database size in bytes"

pg_postmaster_start_time:
  query: "SELECT EXTRACT(EPOCH FROM pg_postmaster_start_time()) AS seconds;"
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "PostgreSQL start time in seconds since epoch"
